      <stop offset="1" stop-color="#121a2a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.22"/>
